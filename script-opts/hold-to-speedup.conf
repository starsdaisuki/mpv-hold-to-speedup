# hold-to-speedup - copy this file into your config folder's script-opts/
# Values shown are the defaults; delete or comment out anything you don't change.

# Playback speed while Space (or the left mouse button) is held.
speed=2.0

# How long the button has to be down before it counts as a hold rather than
# a tap, in seconds. A deliberate tap runs about 0.1s, so going much below
# 0.15 starts catching taps; raise this if pausing sometimes speeds up
# instead.
hold_threshold=0.2

# Also speed up while the left mouse button is held.
enable_mouse=yes

# Tapping Space on the final frame restarts the file instead of doing nothing.
replay_on_end=yes

# Force keep-open=yes so a finished file stays on its last frame. Without this
# there is nothing left to tap on. Only applied when replay_on_end is enabled,
# and only when keep-open is currently "no".
keep_open=yes

# How long the OSD messages stay up, in seconds.
osd_duration=1.0
